<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lavanya Sharma · product designer</title>
    <!-- the share card (hers, 2026-11-23). Crawlers read only this file, so every page shares it. The share
         image (1200 x 630, public/share.png, from her inspiration in art/share/) goes in when it is made -->
    <meta name="description" content="Lavanya Sharma, product designer" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lavanya Sharma" />
    <meta property="og:url" content="https://www.lavanyaaa.com/" />
    <meta property="og:title" content="Lavanya Sharma · product designer" />
    <meta property="og:description" content="Lavanya Sharma, product designer" />
    <link rel="preload" href="/assets/butterfly.png" as="image" />
    <script>
      // The window intro's pictures, fetched while the code downloads rather than after it has run. Only on
      // a load of the home page (or anywhere on lavanyaaa.com, which always opens on the intro): other pages
      // don't show the window. (2026-11-23, the performance pass)
      if (location.pathname === '/' || /(^|\.)lavanyaaa\.com$/.test(location.hostname)) {
        for (const [href, priority] of [['/assets/window-back-clean.webp', 'high'], ['/assets/window-sash-clean.webp', 'auto']]) {
          const link = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', href })
          link.fetchPriority = priority
          document.head.append(link)
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
